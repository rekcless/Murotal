<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murottal Al-Qur’an</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#f2f5f4;--panel:#fff;--ink:#14231f;--mute:#5d6f69;--line:#d5dfdc;--acc:#0f6b59;--acc-ink:#fff;--sel:#e1f0ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f;--panel:#14252b;--ink:#e6f0ee;--mute:#92a8a3;--line:#243a41;--acc:#7fd6bf;--acc-ink:#0b1c18;--sel:#1b3a3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1f;--panel:#14252b;--ink:#e6f0ee;--mute:#92a8a3;--line:#243a41;--acc:#7fd6bf;--acc-ink:#0b1c18;--sel:#1b3a3a;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:820px){.wrap{grid-template-columns:340px 1fr;align-items:start}.player{position:sticky;top:20px;order:2}}
h1{font-size:1.1rem;margin:0 0 2px;font-weight:700}
.sub{color:var(--mute);font-size:.9rem;margin:0}
.player{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
.ar{font-family:Amiri,"Traditional Arabic",serif;font-size:clamp(3rem,10vw,5rem);line-height:1.3;margin:4px 0}
.lat{font-size:1.15rem;font-weight:700;margin:0}
.meta{color:var(--mute);font-size:.9rem;margin:2px 0 20px}
label{display:block;text-align:left;font-size:.85rem;color:var(--mute);margin:0 0 4px}
select,input[type=search]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
audio{width:100%;margin:18px 0 12px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 16px}
button.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
button[aria-pressed=true]{background:var(--sel);border-color:var(--acc)}
.err{color:#b3261e;font-size:.9rem;min-height:1.3em;margin:10px 0 0}
@media(prefers-color-scheme:dark){.err{color:#ff9a90}}
.list{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;order:1}
ul{list-style:none;margin:10px 0 0;padding:0;max-height:62vh;overflow-y:auto}
li button{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;background:none;border-radius:10px;padding:9px 10px}
li button:hover{background:var(--sel)}
li button[aria-current=true]{background:var(--sel);box-shadow:inset 3px 0 0 var(--acc)}
.no{min-width:2.2em;color:var(--mute);font-size:.85rem}
.nm{flex:1}
.na{font-family:Amiri,serif;font-size:1.25rem}
.empty{color:var(--mute);padding:14px 10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0}.chips button{padding:6px 12px;border-radius:999px;font-size:.85rem}.tools{display:flex;gap:8px;margin-top:12px}.tools button{flex:1}.heart{color:var(--acc)}.slpnote{color:var(--mute);font-size:.85rem;margin:8px 0 0;min-height:1.3em}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <section class="player" aria-label="Pemutar">
    <div class="ar" id="ar" lang="ar" dir="rtl">الفاتحة</div>
    <p class="lat" id="lat">Al-Fatihah</p>
    <p class="meta" id="meta">Surah ke-1</p>
    <label for="qari">Pilih qari</label>
    <select id="qari"></select>
    <audio id="aud" controls preload="none"></audio>
    <div class="row">
      <button id="prev">Sebelumnya</button>
      <button id="play" class="main">Putar</button>
      <button id="next">Berikutnya</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="auto" aria-pressed="true">Lanjut otomatis: aktif</button>
      <select id="spd" aria-label="Kecepatan" style="width:auto">
        <option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option>
      </select>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="fav" aria-pressed="false">♡ Tambah ke favorit</button>
      <select id="slp" aria-label="Timer tidur" style="width:auto"><option value="0">Timer tidur: mati</option><option value="15">Berhenti 15 menit</option><option value="30">Berhenti 30 menit</option><option value="60">Berhenti 60 menit</option></select>
    </div>
    <p class="slpnote" id="slpnote"></p>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section class="list" aria-label="Daftar surah">
    <h1>Murottal Al-Qur’an</h1>
    <p class="sub" style="margin-bottom:12px">Pilih surah, lalu pilih suara qari.</p>
    <label for="q">Cari surah</label>
    <input id="q" type="search" placeholder="Nama atau nomor surah" autocomplete="off">
    <div class="tools"><button id="onlyfav" aria-pressed="false">Favorit saja</button></div>
    <div id="recent" class="chips"></div>
    <ul id="ul"></ul>
  </section>
</main>

<script>
const LAT="Al-Fatihah|Al-Baqarah|Ali ‘Imran|An-Nisa’|Al-Ma’idah|Al-An’am|Al-A’raf|Al-Anfal|At-Taubah|Yunus|Hud|Yusuf|Ar-Ra’d|Ibrahim|Al-Hijr|An-Nahl|Al-Isra’|Al-Kahf|Maryam|Ta Ha|Al-Anbiya’|Al-Hajj|Al-Mu’minun|An-Nur|Al-Furqan|Asy-Syu’ara’|An-Naml|Al-Qasas|Al-‘Ankabut|Ar-Rum|Luqman|As-Sajdah|Al-Ahzab|Saba’|Fatir|Ya Sin|As-Saffat|Sad|Az-Zumar|Gafir|Fussilat|Asy-Syura|Az-Zukhruf|Ad-Dukhan|Al-Jasiyah|Al-Ahqaf|Muhammad|Al-Fath|Al-Hujurat|Qaf|Az-Zariyat|At-Tur|An-Najm|Al-Qamar|Ar-Rahman|Al-Waqi’ah|Al-Hadid|Al-Mujadalah|Al-Hasyr|Al-Mumtahanah|As-Saff|Al-Jumu’ah|Al-Munafiqun|At-Tagabun|At-Talaq|At-Tahrim|Al-Mulk|Al-Qalam|Al-Haqqah|Al-Ma’arij|Nuh|Al-Jinn|Al-Muzzammil|Al-Muddassir|Al-Qiyamah|Al-Insan|Al-Mursalat|An-Naba’|An-Nazi’at|‘Abasa|At-Takwir|Al-Infitar|Al-Mutaffifin|Al-Insyiqaq|Al-Buruj|At-Tariq|Al-A’la|Al-Gasyiyah|Al-Fajr|Al-Balad|Asy-Syams|Al-Lail|Ad-Duha|Asy-Syarh|At-Tin|Al-‘Alaq|Al-Qadr|Al-Bayyinah|Az-Zalzalah|Al-‘Adiyat|Al-Qari’ah|At-Takasur|Al-‘Asr|Al-Humazah|Al-Fil|Quraisy|Al-Ma’un|Al-Kausar|Al-Kafirun|An-Nasr|Al-Masad|Al-Ikhlas|Al-Falaq|An-Nas".split("|");
const ARB="الفاتحة|البقرة|آل عمران|النساء|المائدة|الأنعام|الأعراف|الأنفال|التوبة|يونس|هود|يوسف|الرعد|إبراهيم|الحجر|النحل|الإسراء|الكهف|مريم|طه|الأنبياء|الحج|المؤمنون|النور|الفرقان|الشعراء|النمل|القصص|العنكبوت|الروم|لقمان|السجدة|الأحزاب|سبأ|فاطر|يس|الصافات|ص|الزمر|غافر|فصلت|الشورى|الزخرف|الدخان|الجاثية|الأحقاف|محمد|الفتح|الحجرات|ق|الذاريات|الطور|النجم|القمر|الرحمن|الواقعة|الحديد|المجادلة|الحشر|الممتحنة|الصف|الجمعة|المنافقون|التغابن|الطلاق|التحريم|الملك|القلم|الحاقة|المعارج|نوح|الجن|المزمل|المدثر|القيامة|الإنسان|المرسلات|النبأ|النازعات|عبس|التكوير|الانفطار|المطففين|الانشقاق|البروج|الطارق|الأعلى|الغاشية|الفجر|البلد|الشمس|الليل|الضحى|الشرح|التين|العلق|القدر|البينة|الزلزلة|العاديات|القارعة|التكاثر|العصر|الهمزة|الفيل|قريش|الماعون|الكوثر|الكافرون|النصر|المسد|الإخلاص|الفلق|الناس".split("|");
const QARI=[
 ["Mishary Rashid Alafasy","https://server8.mp3quran.net/afs"],
 ["Abdurrahman As-Sudais","https://server11.mp3quran.net/sds"],
 ["Sa’ud Asy-Syuraim","https://server7.mp3quran.net/shur"],
 ["Maher Al-Muaiqly","https://server12.mp3quran.net/maher"],
 ["Abdul Basit Abdus Samad","https://server7.mp3quran.net/basit"],
 ["Mahmoud Khalil Al-Husary","https://server13.mp3quran.net/husr"],
 ["Muhammad Siddiq Al-Minshawi","https://server10.mp3quran.net/minsh"],
 ["Saad Al-Ghamdi","https://server7.mp3quran.net/s_gmd"],
 ["Nasser Al-Qatami","https://server6.mp3quran.net/qtm"],
 ["Ahmad Al-Ajmi","https://server10.mp3quran.net/ajm"]
];
const $=id=>document.getElementById(id);
const aud=$("aud"),sel=$("qari"),ul=$("ul");
let cur=1,auto=true,favs=[],recent=[],onlyFav=false,endAt=0;

QARI.forEach((q,i)=>sel.add(new Option(q[0],i)));
try{const s=JSON.parse(localStorage.getItem("murottal")||"{}");if(s.q>=0&&s.q<QARI.length)sel.value=s.q;if(s.n>=1&&s.n<=114)cur=s.n;if(Array.isArray(s.f))favs=s.f.filter(x=>x>=1&&x<=114);if(Array.isArray(s.r))recent=s.r.filter(x=>x>=1&&x<=114).slice(0,5)}catch(e){}

function save(){try{localStorage.setItem("murottal",JSON.stringify({q:+sel.value,n:cur,f:favs,r:recent}))}catch(e){}}
function url(){return QARI[sel.value][1]+"/"+String(cur).padStart(3,"0")+".mp3"}

function render(){
  const t=$("q").value.trim().toLowerCase().replace(/[’‘'\-\s]/g,"");
  ul.innerHTML="";
  let n=0;
  LAT.forEach((nm,i)=>{
    const k=nm.toLowerCase().replace(/[’‘'\-\s]/g,"");
    if(onlyFav&&!favs.includes(i+1))return;
    if(t&&!k.includes(t)&&String(i+1)!==t&&!ARB[i].includes($("q").value.trim()))return;
    n++;
    const li=document.createElement("li"),b=document.createElement("button");
    b.innerHTML='<span class="no">'+(i+1)+'</span><span class="nm">'+nm+(favs.includes(i+1)?' <span class="heart" role="img" aria-label="favorit">♥</span>':'')+'</span><span class="na" lang="ar">'+ARB[i]+'</span>';
    if(i+1===cur)b.setAttribute("aria-current","true");
    b.onclick=()=>pick(i+1,true);
    li.appendChild(b);ul.appendChild(li);
  });
  if(!n)ul.innerHTML='<li class="empty">'+(onlyFav&&!t?'Belum ada favorit. Putar sebuah surah, lalu pilih Tambah ke favorit.':'Surah tidak ditemukan. Coba nama lain atau nomor 1–114.')+'</li>';
}

function show(){
  $("ar").textContent=ARB[cur-1];
  $("lat").textContent=LAT[cur-1];
  $("meta").textContent="Surah ke-"+cur+" · "+QARI[sel.value][0];
  document.title=LAT[cur-1]+" – Murottal Al-Qur’an";
  ul.querySelectorAll("button[aria-current]").forEach(b=>b.removeAttribute("aria-current"));
  const bs=ul.querySelectorAll("button");
  bs.forEach(b=>{if(b.querySelector(".no")&&+b.querySelector(".no").textContent===cur){b.setAttribute("aria-current","true")}});
}

function load(play){
  $("err").textContent="";
  aud.src=url();
  aud.playbackRate=+$("spd").value;
  recent=[cur].concat(recent.filter(x=>x!==cur)).slice(0,5);
  show();updFav();renderRecent();save();
  if(play)aud.play().catch(()=>{});
}
function pick(n,play){cur=Math.min(114,Math.max(1,n));load(play)}

$("play").onclick=()=>{
  if(!aud.src)load(true);
  else if(aud.paused)aud.play().catch(()=>{});
  else aud.pause();
};
aud.onplay=()=>$("play").textContent="Jeda";
aud.onpause=()=>$("play").textContent="Putar";
aud.onended=()=>{if(auto&&cur<114)pick(cur+1,true)};
aud.onerror=()=>{$("err").textContent="Audio tidak bisa dimuat. Periksa koneksi internet atau coba qari lain."};
$("prev").onclick=()=>pick(cur-1,true);
$("next").onclick=()=>pick(cur+1,true);
sel.onchange=()=>{const was=!aud.paused;const t=aud.currentTime;load(was);};
$("spd").onchange=()=>{aud.playbackRate=+$("spd").value};
$("auto").onclick=e=>{auto=!auto;e.target.setAttribute("aria-pressed",auto);e.target.textContent="Lanjut otomatis: "+(auto?"aktif":"mati")};
$("q").oninput=()=>{render()};
function updFav(){const on=favs.includes(cur);$("fav").setAttribute("aria-pressed",on);$("fav").textContent=on?"♥ Favorit (ketuk untuk hapus)":"♡ Tambah ke favorit"}
function renderRecent(){const r=$("recent");r.innerHTML="";if(!recent.length)return;const l=document.createElement("span");l.className="sub";l.textContent="Terakhir didengar:";r.appendChild(l);recent.forEach(n=>{const b=document.createElement("button");b.textContent=LAT[n-1];b.onclick=()=>pick(n,true);r.appendChild(b)})}
$("fav").onclick=()=>{const i=favs.indexOf(cur);if(i<0)favs.push(cur);else favs.splice(i,1);const sc=ul.scrollTop;updFav();save();render();ul.scrollTop=sc};
$("onlyfav").onclick=e=>{onlyFav=!onlyFav;e.currentTarget.setAttribute("aria-pressed",onlyFav);render()};
$("slp").onchange=()=>{const m=+$("slp").value;endAt=m?Date.now()+m*60000:0;$("slpnote").textContent=m?"Berhenti dalam "+m+" menit":""};
setInterval(()=>{if(!endAt)return;const s=Math.round((endAt-Date.now())/1000);if(s<=0){endAt=0;aud.pause();$("slp").value="0";$("slpnote").textContent="Timer selesai. Audio dihentikan."}else $("slpnote").textContent="Berhenti dalam "+Math.floor(s/60)+" menit "+(s%60)+" detik"},1000);

render();
aud.src=url();show();updFav();renderRecent();
</script>
</body>
</html>
